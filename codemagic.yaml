workflows:
  ios-build:
    name: Build iOS App
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      vars:
        FLUTTER_CHANNEL: stable
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Clean previous builds
        script: |
          flutter clean
      - name: Build iOS App
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - your-email@example.com
      scripts:
        - name: Convert to IPA
          script: |
            mkdir -p build/ios/ipa
            xcrun -sdk iphoneos PackageApplication -v build/ios/iphoneos/Runner.app -o build/ios/ipa/Runner.ipa
      # Upload IPA artifact
      appstore_connect:
        api_key: $APP_STORE_API_KEY # Optional if you want to upload later
