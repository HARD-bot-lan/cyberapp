workflows:
  ios-build:
    name: Build iOS App
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Clean previous builds
        script: flutter clean
      - name: Build IPA
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/Runner.ipa
    publishing:
      email:
        recipients:
          - chillman705@gmail.com
